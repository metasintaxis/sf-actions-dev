# -----------------------------------------------------------------------------
# @file .github/workflows/metadata-api-delete-flow.yml
# @brief GitHub Actions workflow to delete Salesforce flow versions with specified status.
#
# @description
#   This workflow deletes flow versions in Salesforce using the Salesforce CLI
#   and a custom Bash script. It supports dynamic environment selection, robust
#   error handling, and outputs results as both artifacts and GitHub summary.
#
# @usage
#   Trigger manually via GitHub Actions workflow_dispatch with:
#     - developer_name: Developer name of the flow (e.g., TestFlow)
#     - flow_status: Status of flow versions to delete (e.g., Obsolete, Draft, Active)
#
# @requirements
#   - Salesforce CLI
#   - jq
#   - SFDX_SANDBOX_AUTH_URL secret
#
# @outputs
#   - delete-flow-report.json artifact
#   - GitHub Actions summary
# -----------------------------------------------------------------------------

name: 'Metadata API: Delete Flow Versions'

on:
  workflow_dispatch:
    inputs:
      developer_name:
        description: 'Developer name of the flow to delete versions from (e.g., TestFlow)'
        required: true
        type: string
      flow_status:
        description: 'Status of flow versions to delete'
        required: true
        type: choice
        options:
          - 'Obsolete'
          - 'Draft'
          - 'Active'
          - 'InvalidDraft'
        default: 'Obsolete'

run-name: 'Delete ${{ github.event.inputs.flow_status }} flow versions for ${{ github.event.inputs.developer_name }}'

jobs:
  set-target-env:
    name: Set Target Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set_env.outputs.env }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set environment
        id: set_env
        run: |
          chmod +x ./scripts/bash/lib/determine-target-environment.sh
          TARGET_ENV=$(./scripts/bash/lib/determine-target-environment.sh '${{ github.ref }}')
          echo "env=$TARGET_ENV" >> $GITHUB_OUTPUT

  delete-flow-versions:
    needs: set-target-env
    name: Delete Flow Versions
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.set-target-env.outputs.target_env }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Node.js dependencies for Summary Script
        run: npm install @actions/core

      - name: Populate auth file with SFDX_URL secret of the integration orgs
        shell: bash
        run: |
          set -o noclobber
          umask 077
          echo '${{ secrets.SFDX_SANDBOX_AUTH_URL }}' > ./sfdc_auth_url.json

      - name: Authenticate to Sandbox Org
        run: sf org login sfdx-url --sfdx-url-file ./sfdc_auth_url.json --set-default

      - name: Validate Inputs
        run: |
          if [[ -z "${{ github.event.inputs.developer_name }}" || -z "${{ github.event.inputs.flow_status }}" ]]; then
            echo "❌ Some arguments are missing."
            exit 1
          fi

      - name: Confirm Deletion (Safety Check)
        run: |
          echo "⚠️  **DELETION CONFIRMATION** ⚠️"
          echo "About to delete flow versions with:"
          echo "  - Developer Name: ${{ github.event.inputs.developer_name }}"
          echo "  - Status: ${{ github.event.inputs.flow_status }}"
          echo "  - Target Environment: ${{ needs.set-target-env.outputs.target_env }}"
          echo ""
          if [[ "${{ github.event.inputs.flow_status }}" == "Active" ]]; then
            echo "🚨 **WARNING**: You are about to delete ACTIVE flow versions!"
            echo "🚨 This action is IRREVERSIBLE and may break existing functionality!"
            echo "🚨 Please ensure this is intentional."
          fi

      - name: Run Delete Flow Script
        id: delete-flow
        shell: bash
        continue-on-error: true
        env:
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
        run: |
          chmod +x ./scripts/delete-flow/bash/delete-flow.sh
          ./scripts/delete-flow/bash/delete-flow.sh \
            --developer-name "${{ github.event.inputs.developer_name }}" \
            --status "${{ github.event.inputs.flow_status }}" \
            --json \
            --log "./delete-flow.log" > delete-flow-report.json
          echo "Script execution completed with exit code: $?"

      - name: Check for Script Errors and Fail if Present
        id: check-errors
        shell: bash
        run: |
          echo "=== Debug: Contents of delete-flow-report.json ==="
          cat delete-flow-report.json
          echo "=== End Debug ==="
          
          if jq -e '.status == "ERROR"' delete-flow-report.json > /dev/null; then
            echo "error=true" >> $GITHUB_OUTPUT
          else
            echo "error=false" >> $GITHUB_OUTPUT
          fi

      - name: Summarize Flow Deletion Results in GitHub Summary (if no error)
        if: steps.check-errors.outputs.error == 'false'
        run: |
          node scripts/delete-flow/js/summary.js delete-flow-report.json
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY

      - name: Upload deletion report artifact (Success)
        if: steps.check-errors.outputs.error == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Flow Deletion Report
          path: delete-flow-report.json

      - name: Upload deletion report artifact (Error)
        if: steps.check-errors.outputs.error == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Flow Deletion Error Log
          path: delete-flow-report.json

      - name: Summarize Error in GitHub Summary (if error)
        if: steps.check-errors.outputs.error == 'true'
        run: |
          node scripts/delete-flow/js/error-summary.js delete-flow-report.json
          exit 1
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Script Logs
          path: "*.log"
